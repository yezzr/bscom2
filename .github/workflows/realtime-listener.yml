name: realtime-listener

# INSTANT on-chain fresh-deploy listener (replaces the lagging GeckoTerminal poll for time-critical
# detection). A websocket listener is a PERSISTENT process, which GitHub Actions can't schedule directly
# — so we run it as a long-running job (~5h50m) and a cron restarts it every 6h. ~98% uptime, free.
#
# REQUIRES A PUBLIC REPO: a 350-min job x4/day = ~42,000 min/mo, far over the 2,000 free private-repo
# quota. Public repos have UNLIMITED Actions minutes. Secrets stay in GitHub Secrets (never in code).
on:
  schedule:
    # GAP-2 FIX: OVERLAPPING restarts = ZERO downtime. cron every 5h, job runs ~5h10m -> the next job starts
    # ~10 min BEFORE the current one exits, so a listener is ALWAYS up across the handoff (was: 6h cron + 5h50m
    # job = a 10-min gap every 6h, during which a fast create->fund->drain could beat the poll). Every consecutive
    # cron gap (<=5h) is shorter than the job (5h10m) -> guaranteed overlap.
    - cron: '0 */5 * * *'
  workflow_dispatch: {}        # start it manually anytime

permissions:
  contents: read

concurrency:
  # PER-RUN group so scheduled runs OVERLAP instead of serializing. The old single group `realtime-listener`
  # (cancel-in-progress:false) QUEUED the next run until the current exited -> overlap impossible -> the gap.
  group: realtime-listener-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 315
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install websockets
      - name: Diagnose ALCHEMY_KEY reaching the job (LENGTH ONLY — value is never printed)
        env:
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
        run: |
          echo "ALCHEMY_KEY length as seen by this job = ${#ALCHEMY_KEY}"
          echo "  -> 0  = the secret is NOT reaching the job (name/scope/access — GitHub side)"
          echo "  -> ~20 = the secret IS reaching the job (then the flaky ping was a stale/pre-secret run)"

      - name: Run listener (bounded to ~5h50m, then exits cleanly for the next cron)
        env:
          # ALCHEMY_KEY (SECRET, not in code) = reliable BSC log streaming; without it, falls back to flaky
          # keyless publicnode. Use your EXISTING Alchemy key value — as a Secret it's safe on a public repo.
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}   # for contract-source fetches in the arsenal
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # DEAD-MAN'S-SWITCH (optional): create a free healthchecks.io check, add its ping URL as this secret.
          # The listener pings it every ~5s; if BOTH overlapping jobs die, pings stop and healthchecks alerts you.
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          CONFIRM: '0'          # v1: precise classes ping instantly; FORCE-DUMP logged-not-pinged
                                # (fork-sim confirm needs foundry on the runner — a later add)
        run: |
          cd bscmon
          # 5h10m = 18600s. cron every 5h -> the next job starts ~10 min before this one exits. That 10-min
          # overlap is deliberately GENEROUS: GitHub job startup (runner assign + container + pip + WS connect) is
          # VARIABLE and can take 2-3 min, so a 2-min overlap could leave a real gap. 10 min guarantees the new
          # listener is connected before the old exits, at the cost of rare duplicate pings in that window
          # (a far better failure mode than a coverage gap). Stays under the 315-min cap.
          timeout 18600 python -u bsc_realtime_listener.py || echo "listener exited (timeout/restart) — next cron overlaps"
