name: realtime-listener

# INSTANT on-chain fresh-deploy listener (replaces the lagging GeckoTerminal poll for time-critical
# detection). A websocket listener is a PERSISTENT process, which GitHub Actions can't schedule directly
# — so we run it as a long-running job (~5h50m) and a cron restarts it every 6h. ~98% uptime, free.
#
# REQUIRES A PUBLIC REPO: a 350-min job x4/day = ~42,000 min/mo, far over the 2,000 free private-repo
# quota. Public repos have UNLIMITED Actions minutes. Secrets stay in GitHub Secrets (never in code).
on:
  schedule:
    - cron: '0 */6 * * *'     # restart every 6h (job self-exits at ~5h50m, leaving a ~10-min gap)
  workflow_dispatch: {}        # start it manually anytime

permissions:
  contents: read

concurrency:
  group: realtime-listener
  cancel-in-progress: false    # don't kill a running listener when the next cron fires

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install websockets
      - name: Run listener (bounded to ~5h50m, then exits cleanly for the next cron)
        env:
          # ALCHEMY_KEY (SECRET, not in code) = reliable BSC log streaming; without it, falls back to flaky
          # keyless publicnode. Use your EXISTING Alchemy key value — as a Secret it's safe on a public repo.
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}   # for contract-source fetches in the arsenal
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONFIRM: '0'          # v1: precise classes ping instantly; FORCE-DUMP logged-not-pinged
                                # (fork-sim confirm needs foundry on the runner — a later add)
        run: |
          cd bscmon
          # 5h50m = 21000s; exit cleanly before the 355-min job cap so the next cron restarts fresh
          timeout 21000 python -u bsc_realtime_listener.py || echo "listener exited (timeout/restart) — next cron will relaunch"
